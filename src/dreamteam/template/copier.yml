_min_copier_version: "9.0"

# Render all files as Jinja templates (no .jinja suffix required).
# Files without Jinja syntax pass through unchanged.
_templates_suffix: ""

# Persist answers so `dreamteam update` can re-apply the template later.
_answers_file: .copier-answers.yml

# `.bundle/` is the bare-git snapshot used by `dreamteam update` for
# three-way merge (T009). It lives inside the wheel — never copied
# into derived projects. The first two entries are copier's defaults
# (re-stated because providing `_exclude` overrides them entirely).
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - ".bundle"
  - ".bundle/**"
  # T026: `partials/` holds the translatable Architect prompt bodies.
  # They stay visible to the Jinja loader (for `{% include %}`) but are
  # never emitted into derived projects — same "visible, not copied"
  # trick as `.bundle`.
  - "partials"
  - "partials/**"

# T026: Jinja filters used by `.claude/agents/architect.md` to assemble
# the Architect subagent (strip translation frontmatter, lift the
# `description` comment, YAML-quote it). The extension ships inside the
# installed `dreamteam` package (not template data), so copier imports
# it identically on `init` (wheel) and `update` (bundle clone) without
# needing the template root on `sys.path`.
_jinja_extensions:
  - dreamteam._jinja_ext.frontmatter.FrontmatterExtension

# Language prompt — first, before project_name. Narrative files
# (CLAUDE.md, README.md, CONCEPT.md, kanban files) live under
# `i18n/<lang>/` in the template; `_tasks_post_render.py` (below)
# moves the chosen language to project root and removes `i18n/`.
language:
  type: str
  help: "Language for methodology docs (en (English) / ru (Русский) / fr (Français) / de (Deutsch) / zh (中文))"
  choices:
    "en (English)": en
    "ru (Русский)": ru
    "fr (Français)": fr
    "de (Deutsch)": de
    "zh (中文)": zh
  default: "en"

package_manager:
  type: str
  help: "Package manager for the generated project — uv (Astral, fast default), poetry (traditional), pdm (PEP 621-native modern alt), hatch (PyPA, integrates with hatchling build), pip (bare, no extra tooling)"
  choices:
    "uv (Astral)": uv
    "poetry": poetry
    "pdm": pdm
    "hatch (PyPA)": hatch
    "pip (vanilla)": pip
  default: "uv"

project_name:
  type: str
  help: "Project name (lowercase, alphanumeric, dashes/underscores)"
  default: "my-project"

project_description:
  type: str
  help: "Short project description (one sentence)"
  default: ""

author_name:
  type: str
  help: "Author name"
  default: "Your Name"

author_email:
  type: str
  help: "Author email"
  default: "you@example.com"

# T026: Architect subagent (`.claude/agents/architect.md`). The model
# the read-only Architect runs on. `inherit` = same model as the lead
# session; override with opus / sonnet / haiku. Has a default so
# `dreamteam update` on old projects never blocks on an interactive
# prompt (§6.4).
architect_model:
  type: str
  help: "Model for the Architect subagent (inherit / opus / sonnet / haiku)"
  default: "inherit"

# The subagent `name` (architect) and `tools` (Read, Glob, Grep) are
# immutable constants — hardcoded in `.claude/agents/architect.md`
# rather than carried as copier variables. (Leading-underscore keys are
# reserved by copier for its own settings, so they cannot be template
# vars; and only `architect_model` is meant to be user-overridable.)

# Post-render: move i18n/<language>/* → project root, drop i18n/,
# strip translation frontmatter from non-ru languages. The script
# is part of the rendered tree (so it works without src_path
# resolution), then deletes itself at the end.
_tasks:
  - "{{ _copier_python }} _tasks_post_render.py {{ language }}"
