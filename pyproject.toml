[project]
name = "dreamteam-cli"
version = "1.6.1"
description = "Project scaffolding CLI with built-in methodology (Copier-backed)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "vlakir", email = "vlakir1234@gmail.com"},
]
requires-python = ">=3.14"
dependencies = [
    "copier>=9.15.1",
    "pyyaml>=6.0.3",
    "typer>=0.25.1",
]
keywords = ["scaffolding", "template", "copier", "methodology", "kanban", "adr", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]


[project.urls]
Homepage = "https://github.com/vlakir/dreamteam"
Issues = "https://github.com/vlakir/dreamteam/issues"
Source = "https://github.com/vlakir/dreamteam"
Changelog = "https://github.com/vlakir/dreamteam/blob/main/CHANGELOG.md"


[project.scripts]
dreamteam = "dreamteam.cli:app"
dt = "dreamteam.cli:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/dreamteam"]
# template/ contains non-.py resources (md, yml, hooks); hatch
# includes them via the parent package directive above. No
# explicit force-include needed.


[dependency-groups]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.1",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "twine>=6.2.0",
]


[tool.ruff]
unsafe-fixes = true
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "tests",
    "src/dreamteam/template",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1", "D203", "D212",
    "BLE001", "ANN002", "ANN204",
    "RUF001", "COM812", "RUF002",
    "RUF003", "G004", "PLR0912",
    "PLR0913", "D401", "PLR0915",
    "C901", "D205", "N802",
    # S603 — bandit overly-conservative on `subprocess.run` even when
    # called with `shell=False` and a `list[str]` argv (the safe form).
    # dreamteam-cli legitimately shells out to `git` (T009 update flow,
    # bundle introspection). Args are either hardcoded or resolved via
    # `shutil.which`; user-controllable `tag`/`path` values are passed
    # as separate list elements, not shell-interpolated.
    "S603",
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "src"
exclude = ["src/dreamteam/template/"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80 -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that subprocess into uv/ruff/mypy/pytest on a generated project (slow, run via `pytest -m integration`)",
]


[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/dreamteam/template/*"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
